name: Mythos Isles RPG
services:
  - type: web
    name: mythos-isles
    env: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: "/*"
        name: Cache-Control
        value: "public, max-age=3600"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html